# Pipeline CI/CD đã khắc phục 3 lỗi: quyền thực thi, tên secret, build context
name: Broken Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v5

      - name: Cai dat JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Sửa lỗi 1: cấp quyền thực thi cho Gradle Wrapper
      - name: Cap quyen thuc thi cho gradlew
        run: chmod +x gradlew

      - name: Chay kiem thu
        run: ./gradlew test

      # Sửa lỗi 2: dùng đúng tên secret REGISTRY_TOKEN
      - name: Dang nhap Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Sửa lỗi 3: chỉ định đúng context và đường dẫn Dockerfile
      - name: Build va push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/thaominh2006/broken-demo:latest